<fieldset [disabled]="disabled()">
  <legend>
    {{ t('ratingLegend') }} <span class="optional">{{ t('optional') }}</span>
  </legend>
  <div class="stars">
    @for (star of stars; track star) {
      <label [class.on]="star <= (value() ?? 0)">
        <input
          type="radio"
          [name]="name"
          [value]="star"
          [checked]="value() === star"
          (click)="choose(star, $event)"
        />
        <span aria-hidden="true">★</span>
        <span class="visually-hidden">{{ t('stars', { count: star }) }}</span>
      </label>
    }
  </div>
  @if (value() !== null) {
    <button class="clear" type="button" (click)="value.set(null)">{{ t('clearRating') }}</button>
  }
</fieldset>
