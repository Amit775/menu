@let t = messages | messages;
<figure>
  <figcaption>{{ t.priceHistory }}</figcaption>
  <ol>
    @for (bar of bars(); track bar.month) {
      <li [class.latest]="bar.latest">
        <span class="price">{{ bar.averagePrice | shekels }}</span>
        <span class="bar" [style.height.%]="bar.height"></span>
        <span class="month">{{ t.month(bar.month) }}</span>
      </li>
    }
  </ol>
</figure>
