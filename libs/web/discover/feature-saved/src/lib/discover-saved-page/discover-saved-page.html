<header>
  <a mat-icon-button routerLink="/profile" [attr.aria-label]="t('back')">
    <mat-icon aria-hidden="true">{{ backIcon() }}</mat-icon>
  </a>
  <h1>{{ t('title') }}</h1>
</header>

@switch (store.status()) {
  @case ('loading') {
    <div class="state" role="status">
      <mat-spinner diameter="32" [attr.aria-label]="t('loading')" />
    </div>
  }
  @case ('loaded') {
    @if (items().length === 0) {
      <div class="state">
        {{ t('empty') }}
        <a mat-flat-button routerLink="/">{{ t('toFeed') }}</a>
      </div>
    } @else {
      <ul>
        @for (item of items(); track item.id) {
          <li><menu-item-row [item]="item" /></li>
        }
      </ul>
    }
  }
  @default {
    <div class="state" role="alert">
      {{ t('loadFailed') }}
      <button mat-button type="button" (click)="store.reload()">{{ t('retry') }}</button>
    </div>
  }
}
