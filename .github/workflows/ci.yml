name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx's local task cache, carried between runs by GitHub (ADR 0018).
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      - uses: nrwl/nx-set-shas@v4

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Format
        run: pnpm nx format:check

      - name: Lint, typecheck, test, build
        run: pnpm nx affected -t lint typecheck test build --outputStyle=static

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      # Browser binaries are cached per Playwright version; only their system
      # libraries are installed each run.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # WebKit needs ~190 apt packages (GStreamer and friends) and the runner's
      # Ubuntu mirror is sometimes very slow, so keep the downloaded .deb files
      # in the Actions cache and only fetch from the mirror on a cold cache.
      - uses: actions/cache/restore@v4
        id: apt-debs
        with:
          path: ~/apt-debs
          key: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Seed apt with cached packages
        if: steps.apt-debs.outputs.cache-hit == 'true'
        run: sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/

      - name: Install Playwright system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install-deps chromium webkit

      - name: Collect apt packages for the cache
        if: steps.apt-debs.outputs.cache-hit != 'true'
        run: mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/

      - uses: actions/cache/save@v4
        if: steps.apt-debs.outputs.cache-hit != 'true'
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-debs.outputs.cache-primary-key }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium webkit

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-e2e-${{ runner.os }}-

      # Unchanged e2e runs are cache hits.
      - name: E2E
        run: pnpm nx e2e web-e2e --outputStyle=static

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
