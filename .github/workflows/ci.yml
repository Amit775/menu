name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx Cloud remote cache is on via nxCloudId in nx.json.

      - uses: nrwl/nx-set-shas@v4

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Format
        run: pnpm nx format:check

      - name: Lint, typecheck, test, build
        run: pnpm nx affected -t lint typecheck test build --outputStyle=static

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled in the official image,
    # so CI skips the ~190 apt packages `playwright install --with-deps` pulls in
    # (that apt step can hang for many minutes). Keep the tag on the same minor
    # version as @playwright/test in pnpm-lock.yaml; the first step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright matches the image
        run: |
          installed="$(pnpm exec playwright --version | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          if [ "$installed" != "1.64" ]; then
            echo "::error::@playwright/test is $installed but the CI image is v1.64. Update container.image in ci.yml."
            exit 1
          fi

      # The atomized e2e-ci target only runs on Nx Agents (distributed CI); switch once those are enabled.
      # Unchanged e2e runs are Nx Cloud cache hits.
      - name: E2E
        run: pnpm nx e2e web-e2e --outputStyle=static

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
